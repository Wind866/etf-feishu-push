name: ETF 资金流向 · 每交易日 20:00 推送飞书

on:
  schedule:
    # GitHub 的 cron 走 UTC：12:00 UTC = 北京时间 20:00，周一至周五。
    # 准点由 Cloudflare Worker（见 BIGApush/cloudflare/README.md）workflow_dispatch；
    # GitHub cron 只作兜底 —— 同账号实测延迟 3~10 小时甚至丢弃档期。
    # 脚本自带 history.json 交易日判重，两个触发器不会重复推送。
    # 遇到 A 股节假日由脚本内的交易日探测自动跳过。
    - cron: '0 12 * * 1-5'
  workflow_dispatch:
    inputs:
      mode:
        description: 'normal=抓当日并推送 / demo=演示数据出图 / preview=抓数出图不推送 / backfill=回补历史（不推送）'
        type: choice
        default: normal
        options: [normal, demo, preview, backfill]
      days:
        description: '仅 backfill 用：回补最近几个交易日'
        type: string
        default: '10'
      force:
        description: '交易日已推过相同数据也强制重推'
        type: boolean
        default: false

permissions:
  contents: write          # 需要把 data/history.json 提交回仓库，才能累积多日对照
  actions: read

concurrency:
  group: etf-flow-push
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 30          # 回补历史需要逐只取日线，留足余量

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install CJK fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk fonts-wqy-zenhei

      - name: Install dependencies
        run: |
          python -m pip install -q --upgrade pip
          pip install -q -r requirements.txt
          # akshare 只是兜底数据源，装失败不影响主链路
          pip install -q -r requirements-optional.txt || echo "::warning::akshare 安装失败，将只使用东财直连"

      - name: Validate config
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        run: |
          if [ -z "$FEISHU_WEBHOOK" ]; then
            echo "::error::缺少 FEISHU_WEBHOOK，请在 Settings → Secrets and variables → Actions 中配置"
            exit 1
          fi

      - name: Run
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          # FEISHU_SECRET 可选：仅当飞书机器人开启「签名校验」时才需要在 Secrets 里配置
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          TZ: Asia/Shanghai
        run: |
          MODE="${{ inputs.mode }}"
          case "$MODE" in
            demo)     python push.py --demo ;;
            preview)  python push.py --dry-run ;;
            backfill) python backfill.py --days "${{ inputs.days }}" ;;
            *)        if [ "${{ inputs.force }}" = "true" ]; then python push.py --force; else python push.py; fi ;;
          esac

      - name: Upload snapshot (debug)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: snapshot-${{ github.run_id }}
          path: snapshots/*.png
          if-no-files-found: ignore
          retention-days: 7

      # 只在成功且确实会写 history 的模式下回写：
      # 旧版 if: always() 会把失败/取消时的不完整数据也提交，且 git push 的二次报错
      # 会掩盖真正的失败原因。preview/demo 不写库，也不该走提交。
      - name: Commit history
        if: success() && (github.event_name == 'schedule' || inputs.mode == '' || inputs.mode == 'normal' || inputs.mode == 'backfill')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history.json data/etf_codes.txt
          # 回补模式：把断点缓存也强制提交回去（.gitignore 里默认忽略它）。
          # 这是「回补一直成功不了」的根因修复——push2his 频控严，单次跑不完 1800 只，
          # 缓存不落库下次就冷启动重头再来，永远凑不满 1200 只的闸门。
          # 强制入库后，每次手动 backfill 都能从上次进度续传，直到全部补齐。
          if [ "${{ inputs.mode }}" = "backfill" ]; then
            git add -f data/.hist_cache.json 2>/dev/null || true
          fi
          if git diff --cached --quiet; then
            echo "无变化，跳过提交"
            exit 0
          fi
          git commit -m "chore(data): ETF 历史 $(date +%Y-%m-%d)"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin HEAD:"${GITHUB_REF_NAME}"

      - name: 失败告警
        if: failure()
        env:
          ALERT_WEBHOOK: ${{ secrets.ALERT_WEBHOOK }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$ALERT_WEBHOOK" ]; then
            echo "::error::未配置独立告警 Secret ALERT_WEBHOOK；本次告警退回业务 webhook，业务 webhook 故障时告警会一并失效"
          fi
          HOOK="${ALERT_WEBHOOK:-$FEISHU_WEBHOOK}"
          if [ -z "$HOOK" ]; then echo "::error::未配置告警 webhook，跳过失败告警"; exit 0; fi
          curl -sS -X POST "$HOOK" -H "Content-Type: application/json" \
            -d "{\"msg_type\":\"text\",\"content\":{\"text\":\"⚠️ ETF 资金流向任务运行失败，请查看日志：$RUN_URL\"}}" \
            >/dev/null || echo "::error::告警发送失败（独立告警通道可能也失效）"
