name: ETF 资金流向 · 每交易日 20:00 推送飞书

on:
  schedule:
    # GitHub cron 走 UTC：12/13/14 UTC = 北京时间 20/21/22 点，周一至周五。
    # 单档 cron 在同账号实测延迟 3~10 小时、甚至整档丢弃，这里铺三档兜底；
    # 脚本用「行情日期 + 3 小时推送窗口」做幂等判重，不会重复刷屏。
    # 数据日期取行情时间戳而非运行时刻，即使延迟跨过午夜也不会错行或丢当天数据。
    # 准点仍可由外部 Cloudflare Worker 通过 repository_dispatch / workflow_dispatch 触发。
    - cron: '0 12 * * 1-5'
    - cron: '0 13 * * 1-5'
    - cron: '0 14 * * 1-5'
  repository_dispatch:
    types: [etf-push]
  workflow_dispatch:
    inputs:
      mode:
        description: 'normal=抓当日并推送 / demo=演示数据出图 / preview=抓数出图不推送 / backfill=回补历史（不推送）'
        type: choice
        default: normal
        options: [normal, demo, preview, backfill]
      days:
        description: '仅 backfill 用：回补最近几个交易日'
        type: string
        default: '10'
      refresh:
        description: '仅 backfill 用：忽略断点缓存全量重取'
        type: boolean
        default: false
      force:
        description: '交易日已推过相同数据也强制重推'
        type: boolean
        default: false

permissions:
  contents: write          # 需要把 data/history.json 提交回仓库，才能累积多日对照
  actions: read

concurrency:
  group: etf-flow-push
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 30          # 回补历史需要逐只取日线，留足余量

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install CJK fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk fonts-wqy-zenhei

      - name: Install dependencies
        run: |
          python -m pip install -q --upgrade pip
          pip install -q -r requirements.txt
          # akshare 只是兜底数据源，装失败不影响主链路
          pip install -q -r requirements-optional.txt || echo "::warning::akshare 安装失败，将只使用东财直连"

      - name: Validate config
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        run: |
          if [ -z "$FEISHU_WEBHOOK" ]; then
            echo "::error::缺少 FEISHU_WEBHOOK，请在 Settings → Secrets and variables → Actions 中配置"
            exit 1
          fi

      - name: Run
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          # FEISHU_SECRET 可选：仅当飞书机器人开启「签名校验」时才需要在 Secrets 里配置
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          # 失败告警统一由下面的 workflow 步骤发送，关掉脚本内那条，避免群里收到两条
          ALERT_ON_FAIL: "0"
          TZ: Asia/Shanghai
          # workflow_dispatch 的 inputs 一律经 env 传入，绝不插值进 run 脚本。
          # 尤其 days 是自由文本：旧写法 `"${{ inputs.days }}"` 允许通过 API
          # 传入 `10; <任意命令>`，等于把仓库的 contents: write 权限暴露出去。
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_REFRESH: ${{ inputs.refresh }}
          INPUT_DAYS: ${{ inputs.days }}
          INPUT_FORCE: ${{ inputs.force }}
        run: |
          MODE="${INPUT_MODE:-normal}"
          REFRESH=""
          if [ "$INPUT_REFRESH" = "true" ]; then REFRESH="--refresh"; fi
          case "$MODE" in
            demo)     python push.py --demo ;;
            preview)  python push.py --dry-run ;;
            backfill)
              # 白名单：只允许 1~365 的纯数字，挡掉命令注入与异常大的回补
              if ! printf '%s' "$INPUT_DAYS" | grep -Eq '^[0-9]{1,3}$' || \
                 [ "$INPUT_DAYS" -lt 1 ] || [ "$INPUT_DAYS" -gt 365 ]; then
                echo "::error::非法 days 输入（须为 1~365 的整数）：$INPUT_DAYS"
                exit 1
              fi
              python backfill.py --days "$INPUT_DAYS" $REFRESH ;;
            *)        if [ "$INPUT_FORCE" = "true" ]; then python push.py --force; else python push.py; fi ;;
          esac

      - name: Upload snapshot (debug)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: snapshot-${{ github.run_id }}
          path: snapshots/*.png
          if-no-files-found: ignore
          retention-days: 7

      # 只在成功且确实会写 history 的模式下回写：
      # 旧版 if: always() 会把失败/取消时的不完整数据也提交，且 git push 的二次报错
      # 会掩盖真正的失败原因。preview/demo 不写库，也不该走提交。
      - name: Commit history
        if: success() && (github.event_name == 'schedule' || github.event_name == 'repository_dispatch' || inputs.mode == '' || inputs.mode == 'normal' || inputs.mode == 'backfill')
        env:
          INPUT_MODE: ${{ inputs.mode }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history.json data/etf_codes.txt
          # 回补模式：把断点缓存也强制提交回去（.gitignore 里默认忽略它）。
          # 注意缓存会随每次回补增大仓库体积；缓存本身按「最新行情日」自动失效，
          # 不会再出现写满一次就永远不刷新的问题（见 sources.fetch_history）。
          if [ "${INPUT_MODE:-normal}" = "backfill" ]; then
            git add -f data/.hist_cache.json 2>/dev/null || true
          fi
          if git diff --cached --quiet; then
            echo "无变化，跳过提交"
            exit 0
          fi
          git commit -m "chore(data): ETF 历史 $(date +%Y-%m-%d)"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin HEAD:"${GITHUB_REF_NAME}"

      - name: 失败告警
        if: failure()
        env:
          ALERT_WEBHOOK: ${{ secrets.ALERT_WEBHOOK }}
          ALERT_SECRET: ${{ secrets.ALERT_SECRET }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # 原版直接用 curl 发裸 text，机器人开了签名校验时会返回 19021，
          # 「退回业务 webhook」这条兜底其实永远发不出去。这里复用带签名的
          # feishu.send()，并允许独立告警机器人配自己的 ALERT_SECRET。
          python - <<'PY' || echo "::error::失败告警发送失败（请检查告警 webhook 与签名密钥）"
          import os
          from etfpush import feishu

          independent = os.environ.get("ALERT_WEBHOOK", "").strip()
          hook = independent or os.environ.get("FEISHU_WEBHOOK", "").strip()
          if not hook:
              print("::error::未配置告警 webhook，跳过失败告警")
              raise SystemExit(0)
          os.environ["FEISHU_WEBHOOK"] = hook
          os.environ["FEISHU_SECRET"] = (
              os.environ.get("ALERT_SECRET", "") if independent
              else os.environ.get("FEISHU_SECRET", "")
          )
          url = os.environ.get("RUN_URL", "")
          try:
              feishu.send({"msg_type": "text",
                           "content": {"text": f"⚠️ ETF 资金流向任务运行失败，请查看日志：{url}"}})
          except Exception as exc:
              print(f"::error::告警发送失败：{exc}")
          PY
