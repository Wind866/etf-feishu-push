name: CI · 语法 / 单元 / 配置

on:
  pull_request:
  # 旧写法 branches-ignore: [main] 等于生产分支零校验：本仓库的改动基本
  # 都是直接提交到 main，bot 每天也会回写 data/history.json。改成按路径触发，
  # 只有代码 / 配置 / 工作流变更才跑门禁，纯数据提交不占用 CI。
  push:
    paths:
      - '**.py'
      - 'requirements*.txt'
      - '.github/**'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出仓库
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: 准备 Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: 安装校验依赖
        run: python -m pip install -q "PyYAML>=6.0,<7"

      # 回归测试会 import etfpush（sources 顶层依赖 requests），
      # 所以这里也要装运行时依赖，否则 CI 会在收集测试时就 ImportError。
      - name: 安装运行时依赖
        run: python -m pip install -q -r requirements.txt

      - name: 语法编译检查
        run: python -m compileall -q .

      - name: 工作流配置解析
        run: |
          python - <<'PY'
          import glob
          import yaml

          files = sorted(glob.glob('.github/workflows/*.yml')) + ['.github/dependabot.yml']
          assert files, '没有找到任何工作流文件'
          for path in files:
              with open(path, encoding='utf-8') as fh:
                  yaml.safe_load(fh)
              print('OK', path)
          PY

      - name: 单元测试
        run: python -m unittest discover -s tests -v

      - name: Action 版本固定检查
        run: |
          if grep -rnE 'uses:[[:space:]]*[^[:space:]#]+@v[0-9]' .github/workflows --include='*.yml'; then
            echo "::error::存在未固定到 commit SHA 的 Action，请改为 @<sha> # vN"
            exit 1
          fi
          echo "全部 Action 已固定到 commit SHA"

      # workflow_dispatch 的 inputs 绝不能插值进 run 脚本：days 是自由文本，
      # 直接拼接等于把 contents: write 的权限暴露给任何能触发 dispatch 的人。
      - name: Workflow 输入注入检查
        run: |
          python - <<'PY'
          import glob
          import yaml

          bad = []
          needle = chr(36) + "{{ inputs."
          for path in sorted(glob.glob('.github/workflows/*.yml')):
              with open(path, encoding='utf-8') as fh:
                  doc = yaml.safe_load(fh)
              for job in (doc.get('jobs') or {}).values():
                  for step in job.get('steps', []):
                      if needle in (step.get('run') or ''):
                          bad.append(f"{path}: {step.get('name', '(未命名步骤)')}")
          if bad:
              for item in bad:
                  print(f"::error::{item} 把 inputs 直接插入了 run 脚本")
              raise SystemExit(1)
          print('未发现 workflow inputs 源码插值')
          PY

      - name: 告警通道统一入口检查
        run: |
          for f in .github/workflows/*.yml; do
            if [ "$f" = ".github/workflows/ci.yml" ]; then continue; fi
            if grep -q 'if: failure()' "$f" && ! grep -q 'feishu.send' "$f"; then
              echo "::error::$f 有失败告警但未走带签名的发送层"
              exit 1
            fi
          done
          echo "失败告警均走带签名的发送层"
